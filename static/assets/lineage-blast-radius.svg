<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">Blast radius of a column change</title>
  <desc id="d">Rings spread out from the column KNA1.REGION. One hop away is the BigQuery column customers.region. Two hops away are the Looker dashboards Regional sales and Monthly churn, both owned by Finance.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0067a5"/></marker>
  </defs>
  <rect width="640" height="400" fill="#f6f4ef"/>
  <style>
    @media screen and (prefers-reduced-motion:no-preference){
      .ring{transform-origin:150px 200px;animation:ripple .9s ease-out both}
      .ring:nth-child(2){animation-delay:.35s}.ring:nth-child(3){animation-delay:.7s}
      .ring:first-child{animation:ripple .9s ease-out both,beat 2.6s 1.2s ease-in-out infinite}
    }
    @keyframes ripple{from{transform:scale(.2);opacity:0}}
    @keyframes beat{50%{stroke-opacity:.95}}
  </style>
  <g fill="none" stroke="#A100FF">
    <circle class="ring" cx="150" cy="200" r="70" stroke-opacity=".55" stroke-width="2"/>
    <circle class="ring" cx="150" cy="200" r="190" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 6"/>
    <circle class="ring" cx="150" cy="200" r="330" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 8"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#7500C0" letter-spacing="1">
    <text x="166" y="122">CHANGE</text>
    <text x="290" y="62">HOP 1</text>
    <text x="470" y="30">HOP 2</text>
  </g>
  <g stroke="#0067a5" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M206 200H294"/>
    <path d="M436 186L478 124"/>
    <path d="M436 214L478 276"/>
  </g>
  <g stroke="#460073" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M556 132V176"/>
    <path d="M556 268V224"/>
  </g>
  <g font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600">
    <rect x="94" y="180" width="112" height="40" fill="#A100FF"/>
    <text x="150" y="205" fill="#fff" text-anchor="middle">KNA1.REGION</text>
    <rect x="296" y="180" width="140" height="40" fill="#fff" stroke="#0067a5" stroke-width="2"/>
    <text x="366" y="205" fill="#0a0a0a" text-anchor="middle">customers.region</text>
    <rect x="478" y="88" width="150" height="44" fill="#000"/>
    <text x="553" y="115" fill="#fff" text-anchor="middle">Regional sales</text>
    <rect x="478" y="268" width="150" height="44" fill="#000"/>
    <text x="553" y="295" fill="#fff" text-anchor="middle">Monthly churn</text>
    <rect x="506" y="180" width="100" height="40" fill="#fff" stroke="#460073" stroke-width="2"/>
    <text x="556" y="205" fill="#460073" text-anchor="middle">Finance</text>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#0067a5" letter-spacing=".5">
    <text x="214" y="192">MAPS_TO</text>
    <text x="440" y="146" text-anchor="end">USED_BY</text>
    <text x="440" y="262" text-anchor="end">USED_BY</text>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#460073" letter-spacing=".5">
    <text x="562" y="160">OWNS</text>
    <text x="562" y="252">OWNS</text>
  </g>
  <g font-family="Instrument Sans, system-ui, sans-serif" font-size="12" fill="#4a4a4a">
    <text x="94" y="240">SAP</text>
    <text x="296" y="242">BigQuery</text>
    <text x="478" y="80">Looker</text>
    <text x="478" y="330">Looker</text>
  </g>
</svg>
