<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="t d">
  <title id="t">The MCP Tool Shed</title>
  <desc id="d">A shed holds ten labelled MCP servers. For one task, migrating SAP KNA1 to BigQuery, only the SAP and BigQuery servers are lit and lent to the migration agent. The other eight stay on the shelf.</desc>
  <style>
    .lab{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;fill:#4a4a4a}
    .roof{font:700 18px system-ui,-apple-system,sans-serif;fill:#fff;letter-spacing:.02em}
    .off{font:600 14px system-ui,-apple-system,sans-serif;fill:#4a4a4a}
    .on{font:700 14px system-ui,-apple-system,sans-serif;fill:#fff}
    .wtxt{font:600 15px system-ui,-apple-system,sans-serif;fill:#fff}
    .slot{fill:#fff;stroke:#bdbab3;stroke-width:1.5}
    .lit{fill:#7500C0}
    @media (prefers-reduced-motion:no-preference){
      .lit{animation:light .5s .4s both,glow 2.4s 1.4s ease-in-out infinite alternate}
      .lit+.on{animation:show .3s .6s both}
      .dot{animation:show .3s .8s both,blink 1.4s 1.4s ease-in-out infinite}
      .wire{stroke-dasharray:30;stroke-dashoffset:30;animation:wire .5s 1s ease-out forwards}
      .lent{animation:show .4s 1.4s both}
    }
    @keyframes light{from{fill:#fff}}
    @keyframes glow{to{fill:#A100FF}}
    @keyframes show{from{opacity:0}}
    @keyframes blink{50%{opacity:.3}}
    @keyframes wire{to{stroke-dashoffset:0}}
  </style>
  <rect width="480" height="540" fill="#fff"/>

  <polygon points="28,150 240,36 452,150" fill="#000"/>
  <text class="roof" x="240" y="128" text-anchor="middle">MCP Tool Shed</text>
  <rect x="52" y="150" width="376" height="292" fill="#f6f4ef" stroke="#000" stroke-width="2"/>

  <g>
    <rect class="slot" x="76" y="172" width="156" height="40"/><text class="off" x="92" y="197">AWS S3</text>
    <rect class="slot" x="248" y="172" width="156" height="40"/><text class="off" x="264" y="197">Azure Blob</text>
    <rect class="lit" x="76" y="224" width="156" height="40"/><text class="on" x="92" y="249">SAP</text>
    <rect class="lit" x="248" y="224" width="156" height="40"/><text class="on" x="264" y="249">BigQuery</text>
    <rect class="slot" x="76" y="276" width="156" height="40"/><text class="off" x="92" y="301">Salesforce</text>
    <rect class="slot" x="248" y="276" width="156" height="40"/><text class="off" x="264" y="301">Databricks</text>
    <rect class="slot" x="76" y="328" width="156" height="40"/><text class="off" x="92" y="353">ServiceNow</text>
    <rect class="slot" x="248" y="328" width="156" height="40"/><text class="off" x="264" y="353">Atlassian</text>
    <rect class="slot" x="76" y="380" width="156" height="40"/><text class="off" x="92" y="405">Microsoft 365</text>
    <rect class="slot" x="248" y="380" width="156" height="40"/><text class="off" x="264" y="405">Looker</text>
  </g>
  <circle class="dot" cx="216" cy="244" r="5" fill="#fff"/>
  <circle class="dot" cx="388" cy="244" r="5" fill="#fff"/>

  <line class="wire" x1="240" y1="442" x2="240" y2="472" stroke="#7500C0" stroke-width="3"/>
  <text class="lab lent" x="252" y="462">2 OF 10 LENT</text>
  <rect x="52" y="472" width="376" height="48" fill="#000"/>
  <text class="wtxt" x="70" y="502">Agent task: migrate SAP KNA1 to BigQuery</text>
</svg>
