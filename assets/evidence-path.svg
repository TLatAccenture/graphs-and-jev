<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="t d">
  <title id="t">From question to traceable answer</title>
  <desc id="d">A question enters a graph of connected facts. One short path is highlighted as evidence. Jev decides the outcome, and the answer returns with its path and sources.</desc>
  <style>
    .lab{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;fill:#4a4a4a}
    .txt{font:600 15px system-ui,-apple-system,sans-serif;fill:#0a0a0a}
    .wtxt{font:600 15px system-ui,-apple-system,sans-serif;fill:#fff}
    .sm{font:500 12px system-ui,-apple-system,sans-serif;fill:#4a4a4a}
    .edge{stroke:#bdbab3;stroke-width:1.5}
    .path{stroke:#0067a5;stroke-width:4}
  </style>
  <rect width="480" height="540" fill="#fff"/>

  <text class="lab" x="24" y="34">01  QUESTION</text>
  <rect x="24" y="46" width="432" height="52" fill="#000"/>
  <text class="wtxt" x="42" y="78">Who leads ACME&#8217;s renewable projects?</text>

  <line x1="120" y1="98" x2="120" y2="177" stroke="#000" stroke-width="2"/>

  <text class="lab" x="134" y="124">02  CONNECTED EVIDENCE</text>
  <g>
    <line class="edge" x1="120" y1="190" x2="250" y2="170"/>
    <line class="edge" x1="250" y1="170" x2="380" y2="200"/>
    <line class="edge" x1="120" y1="190" x2="190" y2="270"/>
    <line class="edge" x1="190" y1="270" x2="320" y2="290"/>
    <line class="edge" x1="320" y1="290" x2="380" y2="200"/>
    <line class="edge" x1="190" y1="270" x2="80" y2="300"/>
    <line class="edge" x1="320" y1="290" x2="420" y2="320"/>
    <line class="edge" x1="250" y1="170" x2="320" y2="290"/>
    <line class="path" x1="120" y1="190" x2="250" y2="170"/>
    <line class="path" x1="250" y1="170" x2="380" y2="200"/>
    <circle cx="80" cy="300" r="8" fill="#bdbab3"/>
    <circle cx="190" cy="270" r="9" fill="#bdbab3"/>
    <circle cx="320" cy="290" r="9" fill="#bdbab3"/>
    <circle cx="420" cy="320" r="8" fill="#bdbab3"/>
    <circle cx="120" cy="190" r="13" fill="#0067a5"/>
    <circle cx="250" cy="170" r="13" fill="#0067a5"/>
    <circle cx="380" cy="200" r="13" fill="#0067a5"/>
    <text class="sm" x="96" y="222">John Doe</text>
    <text class="sm" x="212" y="150">Solar Farm Alpha</text>
    <text class="sm" x="362" y="232">ACME</text>
    <text class="lab" x="160" y="176" fill="#0067a5">LEADS</text>
    <text class="lab" x="298" y="178" fill="#0067a5">OWNS</text>
  </g>

  <line x1="240" y1="340" x2="240" y2="372" stroke="#000" stroke-width="2"/>

  <text class="lab" x="24" y="366">03  JEV DECISION</text>
  <rect x="200" y="372" width="80" height="44" fill="#A100FF"/>
  <text class="wtxt" x="222" y="400">Jev</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10" font-weight="700" letter-spacing=".08em">
    <line x1="280" y1="384" x2="330" y2="384" stroke="#0b7a3b" stroke-width="3"/>
    <text x="338" y="388" fill="#0b7a3b">ANSWER</text>
    <line x1="280" y1="404" x2="330" y2="404" stroke="#d6d3cc" stroke-width="2"/>
    <text x="338" y="408" fill="#8a8a8a">CLARIFY &#183; REVIEW &#183; REJECT</text>
  </g>

  <line x1="240" y1="416" x2="240" y2="448" stroke="#0b7a3b" stroke-width="3"/>

  <text class="lab" x="24" y="442">04  TRACEABLE ANSWER</text>
  <rect x="24" y="448" width="432" height="72" fill="#e2f4e8"/>
  <rect x="24" y="448" width="5" height="72" fill="#0b7a3b"/>
  <text class="txt" x="44" y="478">John Doe leads Solar Farm Alpha,</text>
  <text class="txt" x="44" y="500">which ACME owns.</text>
  <text class="sm" x="300" y="500">Path &#183; 2 hops &#183; sources</text>
</svg>
