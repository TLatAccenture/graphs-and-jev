name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo audit

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - run: bash tests/static-checks.sh
      - run: bash tests/test-deploy.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:subpath
      - run: cargo build --locked
      - name: Live suite against the Rust service
        run: |
          PORT=18180 ./target/debug/serve & server=$!
          trap 'kill $server' EXIT
          python3 deploy/verify.py http://127.0.0.1:18180
          BASE_URL=http://127.0.0.1:18180 npm run test:live

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t graphs-and-jev:ci .
      - run: IMAGE=graphs-and-jev:ci bash scripts/smoke-container.sh
